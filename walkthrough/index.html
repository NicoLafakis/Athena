<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inside Athena - a storybook walkthrough</title>
<meta name="description" content="A cozy, cutaway house that shows how a command-line tool built around a language model works, one room at a time.">
<meta name="color-scheme" content="light">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/" } }
</script>
</head>
<body>
<canvas id="stage" aria-label="A cutaway storybook house. Use the captions and buttons to follow along." role="img"></canvas>

<header class="bar" id="bar" hidden>
  <div class="brand"><span class="mark" aria-hidden="true"></span><span>Inside Athena</span></div>
  <div class="modes" role="group" aria-label="Mode">
    <button type="button" id="m-play" class="chip">Tour</button>
    <button type="button" id="m-explore" class="chip">Explore</button>
  </div>
</header>

<nav class="plan" id="plan" aria-label="House plan: jump to a room" hidden></nav>

<div id="labels" aria-hidden="true"></div>

<section class="card" id="card" aria-live="polite" hidden>
  <div class="steps" id="steps" aria-hidden="true"></div>
  <p class="kicker" id="c-kicker"></p>
  <h2 id="c-title"></h2>
  <p class="body" id="c-text"></p>
  <div class="row" id="c-controls"></div>
  <div class="bar-progress" id="progress" aria-hidden="true"><i id="progress-fill"></i></div>
  <p class="note" id="c-note"></p>
</section>

<section class="intro" id="intro">
  <div class="intro-card">
    <p class="kicker">A storybook walkthrough</p>
    <h1>Inside Athena</h1>
    <p class="lede" id="intro-lede"></p>
    <div class="row">
      <button type="button" class="btn primary" id="go-play">Take the tour <small>about 5 minutes</small></button>
      <button type="button" class="btn" id="go-explore">Explore on your own</button>
    </div>
    <p class="note" id="intro-note"></p>
  </div>
</section>

<section class="fallback" id="fallback" hidden>
  <h1>Inside Athena</h1>
  <p class="lede">Your browser cannot draw the 3D house, so here is the same walk as a list of rooms.</p>
  <ol id="fallback-list"></ol>
</section>

<noscript>
  <section class="fallback" style="display:block;position:static;padding:24px">
    <h1>Inside Athena</h1>
    <p>This walkthrough needs JavaScript to draw the house. In short: a language model is a clever mind, and Athena is the house around it, with a front door (you type), a study (it thinks), a tool wall (it can act), a gatekeeper (nothing risky without a yes), a notebook (it remembers), a workshop (you add tools) and a balcony (you can talk to it).</p>
  </section>
</noscript>

<script type="module" src="app.js"></script>
</body>
</html>
